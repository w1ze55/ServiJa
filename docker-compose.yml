services:
  mysql:
    image: mysql:8.0
    container_name: servija_mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-servija_db}
      MYSQL_USER: ${LOCAL_DB_USER:-servija_user}
      MYSQL_PASSWORD: ${LOCAL_DB_PASS:-servija_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-servija_root}
    ports:
      - "4306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - frontend_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: servija_mongo
    ports:
      - "37017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - frontend_network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servija_backend
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-servija_db}?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${LOCAL_DB_USER:-servija_user}
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_DB_PASS:-servija_pass}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      SERVIJA_FRONTEND_PUBLIC_URL: ${SERVIJA_FRONTEND_PUBLIC_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SERVIJA_ADMIN_BOOTSTRAP_ENABLED: ${SERVIJA_ADMIN_BOOTSTRAP_ENABLED:-false}
      SERVIJA_ADMIN_BOOTSTRAP_NAME: ${SERVIJA_ADMIN_BOOTSTRAP_NAME:-}
      SERVIJA_ADMIN_BOOTSTRAP_EMAIL: ${SERVIJA_ADMIN_BOOTSTRAP_EMAIL:-}
      SERVIJA_ADMIN_BOOTSTRAP_PASSWORD: ${SERVIJA_ADMIN_BOOTSTRAP_PASSWORD:-}
      SERVIJA_ADMIN_BOOTSTRAP_CPF: ${SERVIJA_ADMIN_BOOTSTRAP_CPF:-}
      SERVIJA_ADMIN_BOOTSTRAP_PHONE: ${SERVIJA_ADMIN_BOOTSTRAP_PHONE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_REGION: ${AWS_S3_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      ASAAS_API_URL: ${ASAAS_API_URL}
      ASAAS_API_KEY: ${ASAAS_API_KEY}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN}
      ASAAS_WALLET_ID: ${ASAAS_WALLET_ID}
      ASAAS_NOTIFICATIONS_BACKFILL_ON_STARTUP: ${ASAAS_NOTIFICATIONS_BACKFILL_ON_STARTUP:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GOOGLE_PROJECT_NAME: ${GOOGLE_PROJECT_NAME:-Servija}
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID}
      GOOGLE_PROJECT_NUMBER: ${GOOGLE_PROJECT_NUMBER}
      # Perfil local lê MONGODB_URI_LOCAL (default = container "mongo"). Perfis prod/default leem MONGODB_URI (Atlas).
      # NÃO definir SPRING_MONGODB_URI aqui: env vars desse formato sobrescrevem o property file e quebram o perfil local.
      MONGODB_URI_LOCAL: ${MONGODB_URI_LOCAL:-mongodb://mongo:27017/servija_chat}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/servija_chat}
    ports:
      - "8080:8080"
    networks:
      - frontend_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: servija_frontend
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - frontend_network

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: servija_frontend_admin
    environment:
      BACKEND_URL: http://backend:8080
      SERVER_NAME: ${ADMIN_SERVER_NAME:-admin.servija.app}
    depends_on:
      - backend
    ports:
      - "3001:80"
    networks:
      - frontend_network

networks:
  frontend_network:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
