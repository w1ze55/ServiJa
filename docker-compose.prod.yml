services:
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servija_backend_prod
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "3000:8080"
    networks:
      - prod_network
    restart: unless-stopped

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: servija_frontend_prod
    env_file:
      - .env.prod
    environment:
      BACKEND_URL: http://backend-prod:8080
      SERVER_NAME: ${SERVER_NAME:-servija.app}
    depends_on:
      - backend-prod
    ports:
      - "8080:80"
    networks:
      - prod_network
    restart: unless-stopped

  landingpage-prod:
    build:
      context: ./landingpage
      dockerfile: Dockerfile
    container_name: servija_landingpage_prod
    ports:
      - "8081:80"
    networks:
      - prod_network
    restart: unless-stopped

networks:
  prod_network:
    name: servija_prod_network
    driver: bridge

