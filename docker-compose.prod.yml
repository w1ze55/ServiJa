services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servija_backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # URL do banco de dados na AWS (RDS)
      # Formato: jdbc:mysql://seu-endpoint-rds.region.rds.amazonaws.com:3306/nome_do_banco?useSSL=true&requireSSL=false&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-noreply@servija.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://3.131.85.191}
    ports:
      - "8080:8080"
    networks:
      - frontend_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Para usar reverse proxy, configure como: http://3.131.85.191/api
        # Para usar backend direto, configure como: http://3.131.85.191:8080
        VITE_API_URL: ${VITE_API_URL:-http://3.131.85.191/api}
    container_name: servija_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - frontend_network
    restart: unless-stopped

networks:
  frontend_network:
    driver: bridge
