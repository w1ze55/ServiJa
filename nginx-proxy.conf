events {
    worker_connections 1024;
}

http {
    client_max_body_size 50M;

    # Configuração para Cloudflare - Obter IP real do cliente
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Upstream para Produção (backend na porta 3000)
    upstream prod_backend {
        server servija_backend_prod:8080;
    }

    # Upstream para Homolog (backend na porta 3001)
    upstream homolog_backend {
        server servija_backend_homolog:8080;
    }

    # Upstream para Frontend Produção
    upstream prod_frontend {
        server servija_frontend_prod:80;
    }

    # Upstream para Frontend Homolog
    upstream homolog_frontend {
        server servija_frontend_homolog:80;
    }

    # ===========================================
    # PRODUÇÃO - servija.app
    # ===========================================
    server {
        listen 80;
        server_name servija.app;

        location / {
            proxy_pass http://prod_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ===========================================
    # HOMOLOG - homolog.servija.app
    # ===========================================
    server {
        listen 80;
        server_name homolog.servija.app;

        location / {
            proxy_pass http://homolog_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Default server - redireciona para prod
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://servija.app$request_uri;
    }
}
