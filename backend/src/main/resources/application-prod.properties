# Production profile overrides
# Activated via SPRING_PROFILES_ACTIVE=prod

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS - override via environment variable
# Exemplo prod: CORS_ALLOWED_ORIGINS=https://servija.app,https://admin.servija.app,https://homolog.servija.app,https://homolog-admin.servija.app
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Server
server.error.include-message=never
server.error.include-binding-errors=never

# L2: Swagger/OpenAPI desabilitados em produção (somente dev/homolog).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
