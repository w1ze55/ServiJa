# Local profile overrides
# Activated via SPRING_PROFILES_ACTIVE=local

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS - override via environment variable
# Exemplo local: CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:3001
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Server
server.error.include-message=always
server.error.include-binding-errors=always

spring.datasource.url=${SERVIJA_DB_URL}
spring.datasource.username=${SERVIJA_DB_USER}
spring.datasource.password=${SERVIJA_DB_PASS}

# Gemini - forcar modelo explicitamente no perfil local
gemini.model=gemini-2.5-flash

# MongoDB - perfil local sempre aponta para o container do docker-compose
spring.mongodb.uri=${MONGODB_URI_LOCAL:mongodb://mongo:27017/servija_chat}
