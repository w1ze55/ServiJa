spring.application.name=servija

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Category Catalog
servija.catalog.seed-resource=${SERVIJA_CATALOG_SEED_RESOURCE:classpath:catalog/service-category-catalog.json}
servija.frontend.public-url=${SERVIJA_FRONTEND_PUBLIC_URL:http://localhost:5173}

# Admin Bootstrap
servija.admin.bootstrap.enabled=${SERVIJA_ADMIN_BOOTSTRAP_ENABLED:false}
servija.admin.bootstrap.name=${SERVIJA_ADMIN_BOOTSTRAP_NAME:}
servija.admin.bootstrap.email=${SERVIJA_ADMIN_BOOTSTRAP_EMAIL:}
servija.admin.bootstrap.password=${SERVIJA_ADMIN_BOOTSTRAP_PASSWORD:}
servija.admin.bootstrap.cpf=${SERVIJA_ADMIN_BOOTSTRAP_CPF:}
servija.admin.bootstrap.phone=${SERVIJA_ADMIN_BOOTSTRAP_PHONE:}

# Trust X-Forwarded-* headers from proxies
server.forward-headers-strategy=FRAMEWORK

# SpringDoc OpenAPI (Swagger) Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true

# AWS S3 Configuration
aws.s3.bucket=${AWS_S3_BUCKET:servija-s3}
aws.s3.region=${AWS_S3_REGION:sa-east-1}
aws.access-key=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY}

# Google Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
google.project.name=${GOOGLE_PROJECT_NAME:Servija}
google.project.id=${GOOGLE_PROJECT_ID}
google.project.number=${GOOGLE_PROJECT_NUMBER}

# Asaas Payment Configuration
asaas.api.url=${ASAAS_API_URL}
asaas.api.key=${ASAAS_API_KEY}
asaas.webhook.token=${ASAAS_WEBHOOK_TOKEN:}
asaas.wallet.id=${ASAAS_WALLET_ID:}
asaas.notifications.backfill-on-startup=${ASAAS_NOTIFICATIONS_BACKFILL_ON_STARTUP:false}

# MongoDB Configuration
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.auto-index-creation=false

# Sentry / GlitchTip Configuration
# Leaving SENTRY_DSN empty disables the SDK (auto-config requires sentry.dsn).
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:}
sentry.release=${SENTRY_RELEASE:}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.01}
sentry.send-default-pii=false
sentry.enable-auto-session-tracking=false
sentry.logging.minimum-event-level=error
sentry.logging.minimum-breadcrumb-level=info
