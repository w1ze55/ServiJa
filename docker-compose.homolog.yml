services:
  backend-homolog:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servija_backend_homolog
    env_file:
      - .env.homolog
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-homolog}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_REGION: ${AWS_S3_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      ASAAS_API_URL: ${ASAAS_API_URL}
      ASAAS_API_KEY: ${ASAAS_API_KEY}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN}
      ASAAS_WALLET_ID: ${ASAAS_WALLET_ID}
    ports:
      - "3001:8080"
    networks:
      - homolog_network
    restart: unless-stopped

  frontend-homolog:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: servija_frontend_homolog
    env_file:
      - .env.homolog
    environment:
      BACKEND_URL: http://backend-homolog:8080
      SERVER_NAME: ${SERVER_NAME:-homolog.servija.app}
    depends_on:
      - backend-homolog
    ports:
      - "8081:80"
    networks:
      - homolog_network
    restart: unless-stopped

networks:
  homolog_network:
    name: servija_homolog_network
    driver: bridge

