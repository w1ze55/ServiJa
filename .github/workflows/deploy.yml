name: Deploy ServiJá

on:
  push:
    branches: [main]

env:
  JAVA_VERSION: '17'

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: ./backend
        run: ./mvnw clean package -DskipTests

      - name: Deploy Backend to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deploy..."
          response=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_DEPLOY_HOOK_URL")
          if [ "$response" -eq 200 ] || [ "$response" -eq 201 ]; then
            echo "✅ Deploy triggered successfully (HTTP $response)"
          else
            echo "❌ Deploy trigger failed (HTTP $response)"
            exit 1
          fi

  # ==========================================================
  # GitHub Secrets Required (Settings > Secrets > Actions):
  # ----------------------------------------------------------
  # RENDER_DEPLOY_HOOK_URL  - Render deploy hook URL
  #                           (Dashboard > Service > Settings > Deploy Hook)
  #
  # Render Environment Variables (set in Render Dashboard):
  # ----------------------------------------------------------
  # SPRING_PROFILES_ACTIVE    = prod
  # JWT_SECRET                = (generate 256-bit random key)
  # MAIL_USERNAME             = (SMTP email)
  # MAIL_PASSWORD             = (SMTP app password)
  # SPRING_DATASOURCE_URL     = (Render PostgreSQL or external DB URL)
  # SPRING_DATASOURCE_USERNAME= (DB user)
  # SPRING_DATASOURCE_PASSWORD= (DB password)
  # CORS_ALLOWED_ORIGINS      = https://your-domain.onrender.com
  # ==========================================================
