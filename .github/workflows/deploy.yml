name: Deploy Servija to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Entra na pasta raiz do projeto
            cd /var/www/Servija
            
            # Atualiza o código de ambas as pastas
            git pull origin main
            
            # --- Atualização do Backend ---
            echo "Atualizando Backend..."
            cd backend
            # Exemplo: se for Node.js use 'npm install' e 'pm2 restart'
            # npm install
            # pm2 restart all 
            
            # --- Atualização do Frontend ---
            echo "Atualizando Frontend..."
            cd ../frontend
            # Exemplo: se for React/Vue, você precisa dar build
            # npm install
            # npm run build
            
            echo "Deploy finalizado com sucesso!"