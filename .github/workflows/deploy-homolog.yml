name: Deploy Servija (Homolog)

on:
  push:
    branches:
      - homolog

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Backend build ──────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build backend JAR
        run: mvn package -DskipTests
        working-directory: backend

      # ── Frontend build ─────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://homolog.servija.app

      # ── Prepare SSH key ────────────────────────────────────────
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ── Deploy artifacts ───────────────────────────────────────
      - name: Upload JAR to EC2
        run: |
          scp -i ~/.ssh/deploy_key \
            backend/target/servija-0.0.1-SNAPSHOT.jar \
            ubuntu@${{ secrets.EC2_HOST }}:/app/homolog/app.jar

      - name: Upload Vue dist to EC2
        run: |
          scp -i ~/.ssh/deploy_key -r \
            frontend/dist/* \
            ubuntu@${{ secrets.EC2_HOST }}:/var/www/homolog/

      # ── Set permissions & restart ────────────────────────────
      - name: Fix permissions and restart service
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} \
            'chmod -R o+rX /var/www/homolog/ && sudo systemctl restart servija-homolog'
