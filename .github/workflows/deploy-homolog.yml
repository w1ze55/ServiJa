name: Deploy Servija (Homolog)

on:
  push:
    branches:
      - homolog

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Compile: builda frontends no runner e o JAR do backend na EC2
  # (reusa ~/.m2 local). Roda em paralelo com `tests`.
  # ─────────────────────────────────────────────────────────────────
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Frontend builds ────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-admin/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://homolog.servija.app

      - name: Build frontend-admin
        run: npm ci && npm run build
        working-directory: frontend-admin
        env:
          VITE_API_URL: https://homolog.servija.app

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      - name: Upload frontend-admin dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-admin-dist
          path: frontend-admin/dist
          retention-days: 7

      # ── Backend build on EC2 (reusa ~/.m2 cache) ───────────────
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure backend build dir exists on EC2
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} \
            'mkdir -p /app/homolog/build'

      - name: Sync backend source to EC2
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'target/' \
            --exclude '.idea/' \
            --exclude '*.iml' \
            --exclude 'src/node_modules/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend/ \
            ubuntu@${{ secrets.EC2_HOST }}:/app/homolog/build/

      - name: Build backend JAR on EC2 (skip tests)
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} \
            'set -e; \
             cd /app/homolog/build; \
             chmod +x mvnw; \
             ./mvnw -B -ntp clean package -DskipTests'

  # ─────────────────────────────────────────────────────────────────
  # Tests: roda a suite JUnit do backend no runner com cache do Maven.
  # Paralelo a `compile`. Falha aqui bloqueia o deploy.
  # ─────────────────────────────────────────────────────────────────
  tests:
    name: Tests
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test
        working-directory: backend

      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: backend/target/surefire-reports/TEST-*.xml
          check_name: JUnit Test Report
          fail_on_failure: true
          require_tests: true
          detailed_summary: true
          include_passed: false

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────
  # Deploy: gated por compile + tests. Baixa dists dos frontends,
  # promove o JAR já buildado na EC2 e reinicia o serviço.
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: [compile, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Download frontend-admin dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-admin-dist
          path: frontend-admin-dist

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Vue dist to EC2
        run: |
          scp -i ~/.ssh/deploy_key -r \
            frontend-dist/* \
            ubuntu@${{ secrets.EC2_HOST }}:/var/www/homolog/

      - name: Upload admin dist to EC2
        run: |
          scp -i ~/.ssh/deploy_key -r \
            frontend-admin-dist/* \
            ubuntu@${{ secrets.EC2_HOST }}:/var/www/homolog-admin/

      - name: Promote JAR, fix permissions and restart service
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} \
            'set -e; \
             cp /app/homolog/build/target/servija-0.0.1-SNAPSHOT.jar /app/homolog/app.jar; \
             sudo mkdir -p /var/www/homolog-admin; \
             sudo chown -R ubuntu:ubuntu /var/www/homolog-admin; \
             chmod -R o+rX /var/www/homolog/ /var/www/homolog-admin/; \
             sudo systemctl restart servija-homolog'
