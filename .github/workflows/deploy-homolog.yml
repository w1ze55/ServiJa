name: Deploy Servija (Homolog)

on:
  push:
    branches:
      - homolog

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Frontend build (CI) ────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://homolog.servija.app

      - name: Build frontend-admin
        run: npm ci && npm run build
        working-directory: frontend-admin
        env:
          VITE_API_URL: https://homolog.servija.app

      # ── Prepare SSH key ────────────────────────────────────────
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ── Backend: sync source to EC2 and build there ────────────
      - name: Ensure backend build dir exists on EC2
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} \
            'mkdir -p /app/homolog/build'

      - name: Sync backend source to EC2
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'target/' \
            --exclude '.idea/' \
            --exclude '*.iml' \
            --exclude 'src/node_modules/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend/ \
            ubuntu@${{ secrets.EC2_HOST }}:/app/homolog/build/

      - name: Build backend JAR on EC2 (reuses ~/.m2 cache)
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} \
            'set -e; \
             cd /app/homolog/build; \
             chmod +x mvnw; \
             ./mvnw -B -ntp clean package -DskipTests; \
             cp target/servija-0.0.1-SNAPSHOT.jar /app/homolog/app.jar'

      # ── Deploy frontend artifacts ──────────────────────────────
      - name: Upload Vue dist to EC2
        run: |
          scp -i ~/.ssh/deploy_key -r \
            frontend/dist/* \
            ubuntu@${{ secrets.EC2_HOST }}:/var/www/homolog/

      - name: Upload admin dist to EC2
        run: |
          scp -i ~/.ssh/deploy_key -r \
            frontend-admin/dist/* \
            ubuntu@${{ secrets.EC2_HOST }}:/var/www/homolog-admin/

      # ── Set permissions & restart ────────────────────────────
      - name: Fix permissions and restart service
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} \
            'sudo mkdir -p /var/www/homolog-admin && sudo chown -R ubuntu:ubuntu /var/www/homolog-admin && chmod -R o+rX /var/www/homolog/ /var/www/homolog-admin/ && sudo systemctl restart servija-homolog'
