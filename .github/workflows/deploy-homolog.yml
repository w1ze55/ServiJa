name: Deploy Servija AWS (Homolog)

on:
  push:
    branches:
      - homolog

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy via SSH no EC2 (Homolog)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/ServiJa

            git checkout homolog
            git pull origin homolog

            # Para apenas os containers de homolog (não afeta produção)
            docker compose -f docker-compose.homolog.yml down

            # Rebuild e start homolog
            docker compose --env-file .env.homolog -f docker-compose.homolog.yml up --build -d

            # Reinicia o proxy para reconhecer as mudanças (se existir)
            docker compose -f docker-compose.proxy.yml up -d --force-recreate
