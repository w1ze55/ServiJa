name: Deploy ServiJá

on:
  push:
    branches:
      - homolog

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: curl -s "${{ secrets.RENDER_BACKEND_HOOK_URL }}"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: curl -s "${{ secrets.RENDER_FRONTEND_HOOK_URL }}"