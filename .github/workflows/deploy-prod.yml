name: Deploy Servija (Prod)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Backend build ──────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build backend JAR
        run: mvn package -DskipTests
        working-directory: backend

      # ── Frontend build ─────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://servija.app

      - name: Build frontend-admin
        run: npm ci && npm run build
        working-directory: frontend-admin
        env:
          VITE_API_URL: https://servija.app

      # ── Prepare SSH key ────────────────────────────────────────
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ── Deploy artifacts ───────────────────────────────────────
      - name: Copy JAR to server
        run: |
          scp -i ~/.ssh/deploy_key \
            backend/target/servija-0.0.1-SNAPSHOT.jar \
            ubuntu@${{ secrets.EC2_HOST }}:/app/prod/app.jar

      - name: Copy Vue dist to server
        run: |
          scp -i ~/.ssh/deploy_key -r \
            frontend/dist/* \
            ubuntu@${{ secrets.EC2_HOST }}:/var/www/prod/

      - name: Copy admin dist to server
        run: |
          scp -i ~/.ssh/deploy_key -r \
            frontend-admin/dist/* \
            ubuntu@${{ secrets.EC2_HOST }}:/var/www/prod-admin/

      # ── Set permissions & restart ────────────────────────────
      - name: Fix permissions and restart service
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} \
            'sudo mkdir -p /var/www/prod-admin && sudo chown -R ubuntu:ubuntu /var/www/prod-admin && chmod -R o+rX /var/www/prod/ /var/www/prod-admin/ && sudo systemctl restart servija-prod'
