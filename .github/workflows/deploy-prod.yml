name: Deploy Servija AWS (Prod)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy via SSH no EC2 (Prod)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/ServiJa

            git checkout main
            git pull origin main

            # Para apenas os containers de produção (não afeta homolog)
            docker compose -f docker-compose.prod.yml down

            # Rebuild e start produção
            docker compose --env-file .env.prod -f docker-compose.prod.yml up --build -d

            # Reinicia o proxy para reconhecer as mudanças (se existir)
            docker compose -f docker-compose.proxy.yml up -d --force-recreate
