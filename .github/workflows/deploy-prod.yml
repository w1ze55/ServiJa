name: Deploy Servija (Prod)

on:
  push:
    branches:
      - main

# M15: GITHUB_TOKEN com privilégio mínimo (somente leitura do repositório).
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Frontend build (CI) ────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://servija.app

      - name: Build frontend-admin
        run: npm ci && npm run build
        working-directory: frontend-admin
        env:
          VITE_API_URL: https://servija.app

      # ── Prepare SSH key ────────────────────────────────────────
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ── Backend: sync source to EC2 and build there ────────────
      - name: Ensure backend build dir exists on EC2
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} \
            'mkdir -p /app/prod/build'

      - name: Sync backend source to EC2
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'target/' \
            --exclude '.idea/' \
            --exclude '*.iml' \
            --exclude 'src/node_modules/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend/ \
            ubuntu@${{ secrets.EC2_HOST }}:/app/prod/build/

      - name: Build backend JAR on EC2 (reuses ~/.m2 cache)
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} \
            'set -e; \
             cd /app/prod/build; \
             chmod +x mvnw; \
             ./mvnw -B -ntp clean package -DskipTests; \
             cp target/servija-0.0.1-SNAPSHOT.jar /app/prod/app.jar'

      # ── Deploy frontend artifacts ──────────────────────────────
      - name: Copy Vue dist to server
        run: |
          scp -i ~/.ssh/deploy_key -r \
            frontend/dist/* \
            ubuntu@${{ secrets.EC2_HOST }}:/var/www/prod/

      - name: Copy admin dist to server
        run: |
          scp -i ~/.ssh/deploy_key -r \
            frontend-admin/dist/* \
            ubuntu@${{ secrets.EC2_HOST }}:/var/www/prod-admin/

      # ── Set permissions & restart ────────────────────────────
      - name: Fix permissions and restart service
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} \
            'sudo mkdir -p /var/www/prod-admin && sudo chown -R ubuntu:ubuntu /var/www/prod-admin && chmod -R o+rX /var/www/prod/ /var/www/prod-admin/ && sudo systemctl restart servija-prod'
